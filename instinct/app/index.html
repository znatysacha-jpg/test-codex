<title>Instinct perso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap">
<style>
/* Layout : iOS 26-27 « Liquid Glass » — le contenu défile sous des commandes en verre qui flottent (onglets, saisie, boutons de barre). */
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-2: #e9e9eb;
  --fill: rgba(118, 118, 128, 0.12);
  --label: #000000;
  --label-2: #6c6c70;
  --separator: rgba(60, 60, 67, 0.22);
  --tint: #0071e3;
  --tint-fill: #0071e3;
  --on-tint: #ffffff;
  --green: #1f7a37;
  --green-fill: #1f7a37;
  --orange: #b54500;
  --red: #d70015;
  /* Verre */
  --glass: rgba(255, 255, 255, 0.62);
  --glass-strong: rgba(255, 255, 255, 0.86);
  --glass-edge: rgba(255, 255, 255, 0.9);
  --glass-rim: rgba(0, 0, 0, 0.06);
  --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.10), 0 1px 3px rgba(0, 0, 0, 0.06);
  --glass-blur: 22px;
  --glass-select: rgba(118, 118, 128, 0.16);
  --ambient-1: rgba(10, 132, 255, 0.16);
  --ambient-2: rgba(94, 92, 230, 0.12);
  --ambient-3: rgba(48, 176, 199, 0.12);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 30px rgba(0, 0, 0, 0.05);
  --font: -apple-system, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --r-card: 26px;
  --r-inner: 16px;
  --r-bubble: 21px;
  --dock-h: 150px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #262629; --fill: rgba(118, 118, 128, 0.24);
    --label: #ffffff; --label-2: #98989f; --separator: rgba(84, 84, 88, 0.6); --tint: #4da3ff; --tint-fill: #0a6fd6; --on-tint: #ffffff;
    --green: #30d158; --green-fill: #1e7a36; --orange: #ff9f0a; --red: #ff6961;
    --glass: rgba(40, 40, 44, 0.58); --glass-strong: rgba(44, 44, 48, 0.88); --glass-edge: rgba(255, 255, 255, 0.16); --glass-rim: rgba(255, 255, 255, 0.06);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); --glass-select: rgba(255, 255, 255, 0.14);
    --ambient-1: rgba(10, 132, 255, 0.20); --ambient-2: rgba(94, 92, 230, 0.16); --ambient-3: rgba(48, 176, 199, 0.12);
    --card-shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #262629; --fill: rgba(118, 118, 128, 0.24);
  --label: #ffffff; --label-2: #98989f; --separator: rgba(84, 84, 88, 0.6); --tint: #4da3ff; --tint-fill: #0a6fd6; --on-tint: #ffffff;
  --green: #30d158; --green-fill: #1e7a36; --orange: #ff9f0a; --red: #ff6961;
  --glass: rgba(40, 40, 44, 0.58); --glass-strong: rgba(44, 44, 48, 0.88); --glass-edge: rgba(255, 255, 255, 0.16); --glass-rim: rgba(255, 255, 255, 0.06);
  --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); --glass-select: rgba(255, 255, 255, 0.14);
  --ambient-1: rgba(10, 132, 255, 0.20); --ambient-2: rgba(94, 92, 230, 0.16); --ambient-3: rgba(48, 176, 199, 0.12);
  --card-shadow: none; color-scheme: dark;
}
/* Réglage « Verre teinté » (comme dans Réglages › Luminosité d'iOS) et « Réduire la transparence » */
:root[data-glass="tinted"] { --glass: var(--glass-strong); }
@media (prefers-reduced-transparency: reduce) { :root { --glass: var(--glass-strong); } }

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--label); font: 17px/1.35 var(--font); letter-spacing: -0.012em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--tint) 55%, transparent); outline-offset: 2px; border-radius: 12px; }
a { color: var(--tint); text-decoration: none; }
svg { display: block; }

/* Fond ambiant : ce que le verre réfracte */
.app { height: 100%; max-width: 680px; margin: 0 auto; position: relative; overflow: hidden;
  background: radial-gradient(60% 40% at 10% 0%, var(--ambient-1), transparent 70%), radial-gradient(50% 35% at 100% 30%, var(--ambient-2), transparent 70%), radial-gradient(60% 40% at 30% 100%, var(--ambient-3), transparent 70%), var(--bg); }
main { position: absolute; inset: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--dock-h) + 16px); }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Matériau verre, avec reflet sur l'arête haute */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(190%); backdrop-filter: blur(var(--glass-blur)) saturate(190%);
  box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 0.5px var(--glass-rim), var(--glass-shadow); }

/* Barre du haut : pas de fond, un fondu doux au bord quand on défile ; boutons en capsule de verre */
.navbar { position: sticky; top: 0; z-index: 5; height: 52px; display: flex; align-items: center; justify-content: center; }
.navbar::before { content: ""; position: absolute; inset: 0 0 -22px; pointer-events: none; opacity: 0; transition: opacity .25s var(--ease);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent);
  background: linear-gradient(to bottom, var(--bg) 60%, color-mix(in srgb, var(--bg) 0%, transparent)); }
.navbar.scrolled::before { opacity: 1; }
.navbar .small { position: relative; font-size: 17px; font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity .2s var(--ease), transform .2s var(--ease); }
.navbar.scrolled .small { opacity: 1; transform: none; }
.navbar .left, .navbar .right { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; z-index: 1; }
.navbar .left { left: max(12px, env(safe-area-inset-left, 0px)); }
.navbar .right { right: max(12px, env(safe-area-inset-right, 0px)); }
.large { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.005em; margin: 0 0 8px; }
.subtitle { color: var(--label-2); font-size: 15px; margin: 0 0 18px; }

.state { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--label); padding: 0 14px; height: 36px; border-radius: 999px; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--label-2); }
.state.ok i { background: #34c759; box-shadow: 0 0 0 3px color-mix(in srgb, #34c759 25%, transparent); }
.state.warn i { background: #ff9500; }
.state.busy i { background: var(--tint); animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .3 } }
.navbtn { height: 36px; padding: 0 14px 0 10px; border: 0; border-radius: 999px; color: var(--tint); display: inline-flex; align-items: center; gap: 2px; font-size: 16px; font-weight: 500; }
.navbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* --- Discussion ------------------------------------------------------- */
.thread { display: flex; flex-direction: column; gap: 3px; padding-block: 4px 8px; }
.when { align-self: center; font-size: 12px; font-weight: 600; color: var(--label-2); margin: 14px 0 6px; }
.msg { max-width: 78%; padding: 9px 14px; border-radius: var(--r-bubble); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 17px; line-height: 1.3; }
.msg.agent { align-self: flex-start; background: var(--surface); box-shadow: var(--card-shadow); }
.msg.user { align-self: flex-end; background: var(--tint-fill); color: var(--on-tint); }
.msg.agent + .msg.user, .msg.user + .msg.agent, .card + .msg, .msg + .card { margin-top: 8px; }
.msg.agent.tail { border-bottom-left-radius: 7px; }
.msg.user.tail { border-bottom-right-radius: 7px; }
.enter { animation: rise .42s var(--spring) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.96); } }

.card { align-self: stretch; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--card-shadow); overflow: hidden; margin-block: 8px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; }
.glyph { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.glyph svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.glyph.blue { background: linear-gradient(180deg, #3a9bff, #0a7aff); } .glyph.green { background: linear-gradient(180deg, #3cc95e, #21a845); } .glyph.orange { background: linear-gradient(180deg, #ffad33, #ff8c00); }
.glyph.indigo { background: linear-gradient(180deg, #7a78ff, #5856d6); } .glyph.gray { background: linear-gradient(180deg, #a1a1a6, #7c7c80); } .glyph.teal { background: linear-gradient(180deg, #4cc4d9, #28a6bd); } .glyph.red { background: linear-gradient(180deg, #ff5a50, #ff3326); }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--label-2); }
.card-body { padding: 10px 18px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.4; }
.card-foot { padding: 0 18px 16px; font-size: 13px; color: var(--label-2); }
.card.ask { box-shadow: var(--card-shadow), inset 0 0 0 1.5px color-mix(in srgb, #ff9500 55%, transparent); }
.card.ask .eyebrow { color: var(--orange); }

/* Boutons en capsule (glass prominent / glass) */
.actionset { display: flex; flex-direction: column; gap: 8px; padding: 2px 16px 16px; }
.pill { min-height: 50px; border-radius: 999px; border: 0; font-size: 17px; font-weight: 600; background: var(--fill); color: var(--tint);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; text-align: center;
  transition: transform .18s var(--spring), opacity .15s var(--ease), background .2s var(--ease); }
.pill:active { transform: scale(0.96); }
.pill.primary { background: var(--tint-fill); color: var(--on-tint); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 6px 16px color-mix(in srgb, var(--tint-fill) 30%, transparent); }
.pill.danger { color: var(--red); }
.pill.wa { background: var(--green-fill); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 16px color-mix(in srgb, var(--green-fill) 30%, transparent); }
.pill.small { min-height: 42px; font-size: 15px; padding: 0 18px; }
.pill:disabled { opacity: .4; cursor: default; transform: none; }
.pill svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.resolved { display: flex; align-items: center; gap: 8px; padding: 0 18px 16px; font-size: 15px; color: var(--label-2); }
.resolved svg { width: 18px; height: 18px; fill: none; stroke: var(--green); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.wa-bubble { margin: 12px 16px; padding: 10px 14px; border-radius: 18px; border-bottom-left-radius: 7px; background: var(--surface-2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }

.opt-list { margin: 10px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px 14px; border-radius: var(--r-inner); background: var(--surface-2); }
.opt .t { font-weight: 600; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.opt .p { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 16px; }
.opt .d { grid-column: 1 / -1; color: var(--label-2); font-size: 14px; line-height: 1.35; }
.opt .go { grid-column: 1 / -1; justify-self: start; margin-top: 10px; }

.typing { align-self: flex-start; display: flex; gap: 5px; padding: 14px 16px; background: var(--surface); box-shadow: var(--card-shadow); border-radius: var(--r-bubble); border-bottom-left-radius: 7px; margin-top: 8px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--label-2); animation: dots 1.3s var(--ease) infinite; }
.typing i:nth-child(2) { animation-delay: .18s } .typing i:nth-child(3) { animation-delay: .36s }
@keyframes dots { 0%, 70%, 100% { opacity: .3; transform: none } 35% { opacity: 1; transform: translateY(-2px) } }

/* --- Dock flottant : suggestions, saisie, onglets ----------------------- */
.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-direction: column; gap: 10px;
  padding-bottom: 10px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.dock > * { pointer-events: auto; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 4px 14px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; color: var(--label); border-radius: 999px; height: 36px; padding: 0 14px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: transform .18s var(--spring); }
.chip:active { transform: scale(.94); }
.chip svg { width: 15px; height: 15px; fill: none; stroke: var(--tint); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.field { display: flex; align-items: flex-end; gap: 8px; }
.round { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 0; display: grid; place-items: center; color: var(--label); transition: transform .18s var(--spring); }
.round:active { transform: scale(.92); }
.round svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--spring); }
.round[aria-expanded="true"] svg { transform: rotate(45deg); }
.input-wrap { flex: 1; min-width: 0; display: flex; align-items: flex-end; border-radius: 23px; padding: 4px 4px 4px 16px; min-height: 46px; }
.input-wrap textarea { flex: 1; min-width: 0; resize: none; max-height: 132px; min-height: 38px; border: 0; background: transparent; padding: 8px 0; line-height: 22px; font-size: 17px; }
.input-wrap textarea:focus { outline: none; }
.input-wrap:focus-within { box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1.5px color-mix(in srgb, var(--tint) 60%, transparent), var(--glass-shadow); }
.send { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 0; background: var(--tint-fill); color: var(--on-tint); display: grid; place-items: center; transition: transform .18s var(--spring), opacity .2s; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.send:disabled { opacity: .3; }
.send:active { transform: scale(.9); }

nav.tabs { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 999px; padding: 5px; margin: 0 6px; }
.tab-indicator { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 999px; background: var(--glass-select);
  transition: transform .45s var(--spring); pointer-events: none; }
nav.tabs button { position: relative; border: 0; background: none; height: 54px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10.5px; font-weight: 600; color: var(--label); letter-spacing: 0; }
nav.tabs svg { width: 26px; height: 26px; }
nav.tabs .o { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs .f { display: none; fill: currentColor; }
nav.tabs button[aria-selected="true"] { color: var(--tint); }
nav.tabs button[aria-selected="true"] .o { display: none; }
nav.tabs button[aria-selected="true"] .f { display: block; }
.badge { position: absolute; top: 4px; left: calc(50% + 7px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ff3b30; color: #fff; font-size: 12px; line-height: 18px; font-weight: 700; text-align: center; }

/* --- Listes groupées --------------------------------------------------- */
.section-title { font-size: 15px; font-weight: 600; color: var(--label); margin: 26px 6px 8px; }
.section-note { font-size: 13px; color: var(--label-2); margin: 8px 18px 0; line-height: 1.4; }
.group { background: var(--surface); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--card-shadow); }
.cell { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 10px 18px; border: 0; background: none; text-align: left; position: relative; color: var(--label); transition: background .15s; }
button.cell:active { background: var(--fill); }
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 18px; left: 18px; border-top: 0.5px solid var(--separator); }
.group.with-icons .cell + .cell::before { left: 60px; }
.cell .grow { flex: 1; min-width: 0; }
.cell .t { font-size: 17px; overflow-wrap: anywhere; }
.cell .s { font-size: 14px; color: var(--label-2); overflow-wrap: anywhere; margin-top: 1px; }
.cell .v { color: var(--label-2); font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cell .v.on { color: var(--green); }
.cell .chev { width: 8px; height: 13px; flex: none; fill: none; stroke: var(--label-2); opacity: .6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cell.action .t { color: var(--tint); }
.cell.destructive .t { color: var(--red); }
.tag { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--tint) 14%, transparent); color: var(--tint); white-space: nowrap; }
.tag.won { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.tag.lost { background: var(--fill); color: var(--label-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: 22px; padding: 14px 16px; min-width: 0; box-shadow: var(--card-shadow); }
.stat b { display: block; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.stat span { font-size: 13px; color: var(--label-2); overflow-wrap: anywhere; }
.doc { background: var(--surface); border-radius: var(--r-card); padding: 18px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.45; box-shadow: var(--card-shadow); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; background: var(--fill); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
.empty { text-align: center; color: var(--label-2); padding: 36px 24px; font-size: 15px; line-height: 1.45; }
.empty svg { width: 44px; height: 44px; margin: 0 auto 10px; fill: none; stroke: currentColor; stroke-width: 1.5; opacity: .7; }
.err { color: var(--red); font-size: 14px; margin: 8px 18px 0; }
.stack { display: flex; flex-direction: column; gap: 10px; padding-block: 4px 12px; }

/* Contrôle segmenté */
.segmented { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px; background: var(--fill); margin: 14px 18px 16px; }
.segmented button { position: relative; z-index: 1; border: 0; background: none; height: 34px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--label); }
.segmented .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.12); transition: transform .4s var(--spring); }
.segmented[data-value="tinted"] .thumb { transform: translateX(100%); }

/* Accueil */
.hero { text-align: center; padding: 18px 8px 4px; }
.app-icon { width: 80px; height: 80px; border-radius: 22px; margin: 0 auto 16px; display: grid; place-items: center; color: #fff; position: relative;
  background: linear-gradient(160deg, #5aa9ff 0%, #0a6fe8 55%, #2a3fd6 100%); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -8px 16px rgba(0,0,0,.12), 0 14px 34px rgba(10, 95, 214, 0.32); }
.app-icon svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hero h2 { font-size: 28px; line-height: 34px; font-weight: 700; margin: 0 0 8px; text-wrap: balance; }
.hero p { color: var(--label-2); margin: 0 auto; max-width: 34ch; font-size: 16px; line-height: 1.4; }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--tint-fill); color: var(--on-tint); font-size: 14px; font-weight: 700; display: grid; place-items: center; flex: none; align-self: flex-start; margin-top: 1px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <main>
    <!-- Discussion -->
    <section class="view" id="view-chat" aria-label="Discussion">
      <div class="navbar" data-title="Instinct"><span class="small">Instinct</span><div class="right"><span class="state glass" id="state"><i></i><span id="stateText">Connexion…</span></span></div></div>
      <div class="pad">
        <h1 class="large">Instinct</h1>
        <div id="setup" hidden></div>
        <div class="thread" id="thread" aria-live="polite"></div>
      </div>
    </section>
    <!-- Prospection -->
    <section class="view" id="view-crm" aria-label="Prospection" hidden>
      <div class="navbar"><span class="small">Prospection</span></div>
      <div class="pad"><h1 class="large">Prospection</h1><div id="crm" class="stack"></div></div>
    </section>
    <!-- Mémoire -->
    <section class="view" id="view-mem" aria-label="Mémoire" hidden>
      <div class="navbar"><div class="left" id="memBack"></div><span class="small" id="memSmall">Mémoire</span></div>
      <div class="pad"><h1 class="large" id="memTitle">Mémoire</h1><div id="mem" class="stack"></div></div>
    </section>
    <!-- Réglages -->
    <section class="view" id="view-set" aria-label="Réglages" hidden>
      <div class="navbar"><span class="small">Réglages</span></div>
      <div class="pad"><h1 class="large">Réglages</h1><div id="set" class="stack"></div></div>
    </section>
  </main>

  <div class="dock" id="dock">
    <div class="chips" id="chips" hidden></div>
    <form class="field" id="composer">
      <button class="round glass" id="plus" type="button" aria-label="Suggestions" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="input-wrap glass">
        <textarea id="input" rows="1" placeholder="Demande à Instinct" aria-label="Message à l'agent"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="Envoyer" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
    </form>
    <nav class="tabs glass" role="tablist" aria-label="Sections">
      <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
      <button role="tab" aria-selected="true" data-view="chat"><svg viewBox="0 0 28 28" aria-hidden="true"><path class="o" d="M14 4.5c5.8 0 10.5 3.8 10.5 8.6s-4.7 8.6-10.5 8.6c-1.2 0-2.3-.2-3.4-.5L5 23.5l1.6-4.4c-1.9-1.6-3.1-3.7-3.1-6 0-4.8 4.7-8.6 10.5-8.6z"/><path class="f" d="M14 3.7c6.2 0 11.3 4.1 11.3 9.4s-5.1 9.4-11.3 9.4c-1.2 0-2.3-.1-3.3-.4l-6.2 2.7a.6.6 0 0 1-.8-.8l1.7-4.4C3.6 17.9 2.7 15.6 2.7 13.1c0-5.3 5.1-9.4 11.3-9.4z"/></svg><span>Discussion</span></button>
      <button role="tab" aria-selected="false" data-view="crm"><svg viewBox="0 0 28 28" aria-hidden="true"><path class="o" d="M5 23.5V13m6 10.5V8m6 15.5V11m6 12.5V4.5"/><path class="f" d="M3.5 13a1.5 1.5 0 0 1 3 0v10.5a1.5 1.5 0 0 1-3 0zm6-5a1.5 1.5 0 0 1 3 0v15.5a1.5 1.5 0 0 1-3 0zm6 3a1.5 1.5 0 0 1 3 0v12.5a1.5 1.5 0 0 1-3 0zm6-6.5a1.5 1.5 0 0 1 3 0v19a1.5 1.5 0 0 1-3 0z"/></svg><span>Prospection</span></button>
      <button role="tab" aria-selected="false" data-view="mem"><svg viewBox="0 0 28 28" aria-hidden="true"><path class="o" d="M8 3.5h8.5l5.5 5.5v14a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 7 23V5a1.5 1.5 0 0 1 1-1.5zM16 3.5V9h6M10.5 14h7M10.5 18h7"/><path class="f" d="M8.5 2.8h7.6c.4 0 .8.2 1.1.4l5.6 5.6c.3.3.4.7.4 1.1v13.6c0 1.2-1 2.2-2.2 2.2H8.5c-1.2 0-2.2-1-2.2-2.2V5c0-1.2 1-2.2 2.2-2.2zm1.8 10.6a.8.8 0 0 0 0 1.6h7.4a.8.8 0 0 0 0-1.6zm0 4a.8.8 0 0 0 0 1.6h7.4a.8.8 0 0 0 0-1.6z"/></svg><span>Mémoire</span></button>
      <button role="tab" aria-selected="false" data-view="set"><svg viewBox="0 0 28 28" aria-hidden="true"><g class="o"><circle cx="14" cy="14" r="3.6"/><path d="M14 3.5l1.8 2.6 3.1-.7.7 3.1 2.6 1.8-1.4 2.7 1.4 2.7-2.6 1.8-.7 3.1-3.1-.7L14 24.5l-1.8-2.6-3.1.7-.7-3.1-2.6-1.8 1.4-2.7-1.4-2.7 2.6-1.8.7-3.1 3.1.7z"/></g><path class="f" fill-rule="evenodd" d="M14 2.6l2.1 2.8 3.4-.8.8 3.4 2.9 2.1-1.6 3.1 1.6 3.1-2.9 2.1-.8 3.4-3.4-.8L14 25.4l-2.1-2.8-3.4.8-.8-3.4-2.9-2.1 1.6-3.1-1.6-3.1 2.9-2.1.8-3.4 3.4.8zm0 7.6a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/></svg><span>Réglages</span></button>
    </nav>
  </div>
</div>

<script>
(() => {
  const SERVER = "Instinct perso";
  const I = {
    calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    fork: '<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 3c-1.7 1.2-2.5 3.3-2.5 6v3h2.5V21"/>',
    chat: '<path d="M12 4c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-1 0-1.9-.1-2.7-.4L5 19.5l1.2-3.5C4.8 14.7 3.5 13 3.5 11c0-3.9 3.8-7 8.5-7z"/>',
    bed: '<path d="M3 18v-9M3 14h18v4M21 18v-3a3 3 0 0 0-3-3h-7v2"/><circle cx="7" cy="11.5" r="1.8"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8"/>',
    people: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8M16 5.2a3 3 0 0 1 0 5.6M17.5 14.4c1.6.6 2.7 2.1 3 4.6"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    hand: '<path d="M12 3.5v9M8.5 6v7M15.5 6v7M5 10v4.5a7 7 0 0 0 14 0V8.5"/>',
    doc: '<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z"/><path d="M14 3.5V8h4"/>',
    arrow: '<path d="M7 17L17 7M9 7h8v8"/>',
    down: '<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
    bolt: '<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
    bubble2: '<path d="M4 6.5h11v8H8l-4 3z"/><path d="M15 9.5h5v8l-3-2h-6v-1"/>',
    mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4 7l8 6 8-6"/>',
    repo: '<path d="M5 4.5h11.5a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z"/><path d="M5 17.5a2 2 0 0 1 2-2h11.5"/>',
    stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>',
    refresh: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5V9H15"/>',
    sparkle: '<path d="M12 3.5l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5L4.5 11l5.5-2z"/>',
  };
  const CHIPS = [
    ["bolt", "Briefing", "Fais-moi le point : agenda d'aujourd'hui, e-mails importants et relances à faire."],
    ["fork", "Restaurant", "Réserve-moi un restaurant "],
    ["chat", "WhatsApp", "Écris un message WhatsApp à "],
    ["bed", "Hôtel, train", "Trouve-moi "],
    ["target", "Prospects", "Trouve-moi 10 entreprises à prospecter dans "],
    ["people", "Point 1:1", "Prépare mon prochain point individuel avec "],
  ];
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const svg = (name, cls) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); if (cls) s.setAttribute("class", cls); s.innerHTML = I[name] || ""; return s; };
  const glyph = (name, color) => { const g = el("span", "glyph " + color); g.append(svg(name)); return g; };
  const chevron = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 8 13"); s.setAttribute("class", "chev"); s.setAttribute("aria-hidden", "true"); s.innerHTML = '<path d="M1.5 1.5l5 5-5 5"/>'; return s; };
  const safeUrl = (u) => (typeof u === "string" && u.startsWith("https://")) ? u : "";
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let mcp = null, downloads = null, connected = false;
  let lastId = 0, lastAt = 0, lastRole = "", fastUntil = 0, timer = null, waiting = false, sending = false;
  const rendered = new Set();

  // --------------------------------------------------------------- appels
  async function call(tool, input) {
    const res = await mcp.callTool(SERVER, tool, input || {}, { cache: false });
    return res.payload ?? {};
  }
  function explain(err) {
    const code = err && err.code;
    if (code === "server_not_connected" || code === "selection_required") return "setup";
    if (code === "needs_reauth") return "Reconnecte « " + SERVER + " » dans claude.ai › Réglages › Connecteurs.";
    if (code === "not_in_manifest" || code === "approval_required" || code === "not_granted") return "Autorise le connecteur « " + SERVER + " » pour cette app (menu Autorisations de l'artefact).";
    if (code === "server_unavailable") return "Ta passerelle ne répond pas pour l'instant. Nouvel essai dans quelques secondes.";
    if (code === "tool_error") return "L'agent a renvoyé une erreur : " + (err.message || "");
    return "Connexion impossible (" + (code || "erreur inconnue") + ").";
  }
  function setState(kind, text) { $("state").className = "state " + (kind || ""); $("stateText").textContent = text; }

  // --------------------------------------------------------- barres de navigation
  document.querySelectorAll(".view").forEach((v) => {
    const bar = v.querySelector(".navbar");
    v.addEventListener("scroll", () => bar.classList.toggle("scrolled", v.scrollTop > 34), { passive: true });
  });

  // ------------------------------------------------------------- accueil
  function showSetup(reason) {
    connected = false;
    setState("warn", "À brancher");
    const box = $("setup"); box.hidden = false; box.replaceChildren();
    const hero = el("div", "hero");
    const icon = el("div", "app-icon"); icon.append(svg("sparkle"));
    hero.append(icon, el("h2", null, "Branche ton agent"), el("p", null, "L'app parle à ton agent par un connecteur claude.ai. Trois étapes, une seule fois."));
    box.append(hero);
    box.append(el("div", "section-title", "Étapes"));
    const g = el("div", "group");
    const steps = [
      ["Déploie la passerelle", "Dossier instinct/ du dépôt, voir le README (Render, environ 15 min)."],
      ["Ajoute le connecteur", "claude.ai › Réglages › Connecteurs › Ajouter un connecteur personnalisé, nommé exactement « " + SERVER + " », adresse https://<ta-passerelle>/mcp/<MCP_SECRET>/"],
      ["Autorise-le ici", "Reviens dans l'app et accepte quand Claude te le demande."],
    ];
    steps.forEach(([t, s], i) => {
      const c = el("div", "cell"); const n = el("span", "num", String(i + 1));
      const gr = el("div", "grow"); gr.append(el("div", "t", t), el("div", "s", s));
      c.append(n, gr); g.append(c);
    });
    box.append(g);
    if (reason && reason !== "setup") box.append(el("p", "err", reason));
    const g2 = el("div", "group"); g2.style.marginTop = "22px";
    const retry = el("button", "cell action"); retry.type = "button";
    const rt = el("div", "grow"); rt.append(el("div", "t", "Réessayer la connexion"));
    retry.append(rt); retry.onclick = () => boot();
    g2.append(retry); box.append(g2);
  }

  // ------------------------------------------------------------- fil
  function timeLabel(at) {
    const d = new Date(at * 1000), now = new Date();
    const hm = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === now.toDateString()) return "Aujourd'hui " + hm;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return "Hier " + hm;
    return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }) + " " + hm;
  }
  function bubble(m) {
    if (m.kind === "text") return el("div", "msg " + (m.role === "user" ? "user" : "agent"), m.text);
    if (m.kind === "choices") return choiceCard(m);
    if (m.kind === "whatsapp") return whatsappCard(m);
    if (m.kind === "options") return optionsCard(m);
    if (m.kind === "file") return fileCard(m);
    return el("div", "msg agent", m.text || "");
  }
  function head(icon, color, label) { const h = el("div", "card-head"); h.append(glyph(icon, color), el("span", "eyebrow", label)); return h; }
  function resolvedLine(text) { const r = el("div", "resolved"); r.append(svg("check"), el("span", null, text)); return r; }

  function choiceCard(m) {
    const d = m.data || {};
    const card = el("div", "card ask");
    card.append(head("hand", "orange", "Ton accord"), el("div", "card-body", m.text));
    if (d.ouverte === false) { card.append(resolvedLine("Déjà traité")); return card; }
    const set = el("div", "actionset");
    const opts = d.options || [];
    opts.forEach((label, i) => {
      const isLast = i === opts.length - 1 && opts.length > 1;
      const danger = /refus|annul|bloqu|non\b/i.test(label);
      const b = el("button", "pill" + (i === 0 ? " primary" : danger || (isLast && opts.length === 2) ? " danger" : ""), label.replace(/^[✅❌]\s*/, ""));
      b.type = "button";
      b.onclick = () => answer(d.validation_id, i, card, b.textContent);
      set.append(b);
    });
    card.append(set);
    return card;
  }
  async function answer(id, index, card, label) {
    const set = card.querySelector(".actionset");
    set.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      const r = await call("repondre", { validation_id: id, choix: index });
      set.replaceWith(resolvedLine(r.note && r.note !== "Déjà traité." ? label : "Déjà traité"));
      card.classList.remove("ask");
      waiting = true; fastPoll();
    } catch (e) {
      set.querySelectorAll("button").forEach((b) => (b.disabled = false));
      card.append(el("p", "err", explain(e)));
    }
  }
  function whatsappCard(m) {
    const d = m.data || {};
    const card = el("div", "card");
    card.append(head("chat", "green", "WhatsApp · " + (d.nom || "")), el("div", "wa-bubble", d.message || ""));
    const row = el("div", "row-actions");
    const link = safeUrl(d.lien);
    if (link) { const a = el("a", "pill small wa"); a.href = link; a.target = "_blank"; a.rel = "noopener"; a.append(svg("arrow"), "Ouvrir dans WhatsApp"); row.append(a); }
    const copy = el("button", "pill small", "Copier"); copy.type = "button";
    copy.onclick = async () => { try { await navigator.clipboard.writeText(d.message || ""); copy.textContent = "Copié"; } catch { copy.textContent = "Sélectionne le texte"; } };
    row.append(copy);
    card.append(row, el("div", "card-foot", "Rien ne part tant que tu n'appuies pas sur Envoyer dans WhatsApp."));
    return card;
  }
  function optionsCard(m) {
    const d = m.data || {};
    const card = el("div", "card");
    card.append(head("calendar", "blue", d.titre || "Options"));
    const list = el("div", "opt-list");
    (d.options || []).forEach((o) => {
      const row = el("div", "opt");
      row.append(el("div", "t", o.titre || ""), el("div", "p", o.prix || ""));
      if (o.details) row.append(el("div", "d", o.details));
      const link = safeUrl(o.lien);
      if (link) { const a = el("a", "pill small primary go"); a.href = link; a.target = "_blank"; a.rel = "noopener"; a.append("Réserver", svg("arrow")); row.append(a); }
      list.append(row);
    });
    card.append(list);
    return card;
  }
  function fileCard(m) {
    const d = m.data || {};
    const card = el("div", "card");
    card.append(head("doc", "indigo", "Document"), el("div", "card-body", d.filename || "fichier"));
    const row = el("div", "row-actions");
    const b = el("button", "pill small primary"); b.type = "button";
    b.append(svg("down"), downloads ? "Enregistrer" : "Aussi dans Telegram");
    b.disabled = !downloads;
    b.onclick = async () => {
      b.disabled = true;
      try {
        const f = await call("fichier", { file_id: d.file_id });
        if (f.erreur) throw { code: "tool_error", message: f.erreur };
        const bin = Uint8Array.from(atob(f.base64), (c) => c.charCodeAt(0));
        await downloads.save({ filename: f.nom || d.filename, data: bin });
        b.replaceChildren(svg("check"), "Enregistré");
      } catch (e) {
        b.disabled = false;
        if (e && e.code === "declined") return;
        card.append(el("p", "err", e && e.code === "rejected_extension" ? "Ce type de fichier ne s'enregistre pas ici." : explain(e)));
      }
    };
    row.append(b); card.append(row);
    if (m.text) card.append(el("div", "card-foot", m.text));
    return card;
  }
  function appendMessages(list, animate) {
    const thread = $("thread");
    const v = $("view-chat");
    const atBottom = v.scrollHeight - v.scrollTop - v.clientHeight < 160;
    $("typing")?.remove();
    for (const m of list) {
      if (rendered.has(m.id)) continue;
      rendered.add(m.id);
      if (m.at && m.at - lastAt > 15 * 60) thread.append(el("div", "when", timeLabel(m.at)));
      const node = bubble(m);
      if (m.kind === "text") {
        const prev = thread.lastElementChild;
        if (prev && prev.classList.contains("msg") && lastRole === m.role) prev.classList.remove("tail");
        node.classList.add("tail");
      }
      if (animate && !reduced) node.classList.add("enter");
      thread.append(node);
      lastId = Math.max(lastId, m.id); lastAt = m.at || lastAt; lastRole = m.kind === "text" ? m.role : "";
      if (m.role === "agent") waiting = false;
    }
    if (waiting) { const t = el("div", "typing"); t.id = "typing"; t.setAttribute("aria-label", "L'agent écrit"); t.append(el("i"), el("i"), el("i")); thread.append(t); }
    if (atBottom || list.length) requestAnimationFrame(() => { v.scrollTop = v.scrollHeight; });
  }

  async function refresh() {
    if (!connected) return;
    try {
      const first = !lastId;
      const p = await call("messages", { apres: lastId, limite: first ? 60 : 100 });
      const msgs = p.messages || [];
      appendMessages(msgs, !first);
      updateBadge(p.en_attente || 0);
      setState(waiting ? "busy" : "ok", waiting ? "Au travail" : "En ligne");
      if (first && !msgs.length) welcome();
    } catch (e) {
      if (explain(e) === "setup") return showSetup();
      setState("warn", "Hors ligne");
    }
  }
  function welcome() {
    if ($("thread").children.length) return;
    const card = el("div", "card");
    card.append(head("sparkle", "blue", "Bonjour"), el("div", "card-body", "Écris-moi comme à un assistant : un e-mail à préparer, une table à réserver, un message WhatsApp à écrire, des prospects à trouver.\n\nJe te demande toujours ton accord avant d'envoyer, de réserver ou d'acheter."));
    $("thread").append(card);
  }
  function schedule() {
    clearTimeout(timer);
    const fast = Date.now() < fastUntil;
    timer = setTimeout(async () => { await refresh(); schedule(); }, document.hidden ? 60000 : fast ? 2500 : 20000);
  }
  function fastPoll() { fastUntil = Date.now() + 4 * 60 * 1000; schedule(); setTimeout(refresh, 600); }
  function updateBadge(n) {
    const tab = document.querySelector('[data-view="chat"]');
    tab.querySelector(".badge")?.remove();
    if (n > 0) { const b = el("span", "badge", String(n)); b.setAttribute("aria-label", n + " en attente"); tab.append(b); }
  }

  // ------------------------------------------------------------- envoi
  async function send(text) {
    text = text.trim();
    if (!text || sending) return;
    if (!connected) { showSetup(); return; }
    sending = true; $("sendBtn").disabled = true;
    try {
      await call("envoyer", { texte: text });
      $("input").value = ""; autosize();
      waiting = true; setState("busy", "Au travail");
      appendMessages([], true);
      fastPoll();
    } catch (e) {
      const why = explain(e);
      if (why === "setup") showSetup(); else $("thread").append(el("p", "err", why));
    } finally {
      sending = false; $("sendBtn").disabled = !$("input").value.trim();
    }
  }
  function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 132) + "px"; $("sendBtn").disabled = !t.value.trim() || sending; }

  // ------------------------------------------------------------- onglets
  function show(view) {
    const order = ["chat", "crm", "mem", "set"];
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
    $("tabIndicator").style.transform = "translateX(" + order.indexOf(view) * 100 + "%)";
    for (const v of order) $("view-" + v).hidden = v !== view;
    $("composer").hidden = view !== "chat";
    if (view !== "chat") toggleChips(false);
    if (view === "crm") loadCrm();
    if (view === "mem") loadMemory();
    if (view === "set") loadSettings();
    if (view === "chat") { const v = $("view-chat"); v.scrollTop = v.scrollHeight; }
  }
  function cell(opts) {
    const c = el(opts.onclick ? "button" : "div", "cell" + (opts.cls ? " " + opts.cls : ""));
    if (opts.onclick) { c.type = "button"; c.onclick = opts.onclick; }
    if (opts.icon) c.append(glyph(opts.icon, opts.color || "gray"));
    const g = el("div", "grow"); g.append(el("div", "t", opts.title));
    if (opts.sub) g.append(el("div", "s", opts.sub));
    c.append(g);
    if (opts.tag) c.append(opts.tag);
    if (opts.value != null) c.append(el("span", "v" + (opts.on ? " on" : ""), opts.value));
    if (opts.onclick && !opts.cls) c.append(chevron());
    return c;
  }
  function emptyState(icon, text) { const e = el("div", "empty"); e.append(svg(icon), el("div", null, text)); return e; }
  function needConnector(box) { box.append(emptyState("sparkle", "Branche le connecteur depuis l'onglet Discussion pour voir cette page.")); }

  function parsePipeline(md) {
    const rows = [];
    for (const line of md.split("\n")) {
      const l = line.trim();
      if (!l.startsWith("|") || /^\|\s*-/.test(l)) continue;
      const c = l.split("|").slice(1, -1).map((x) => x.trim());
      if (!c[0] || c[0] === "Entreprise") continue;
      rows.push({ entreprise: c[0], contact: c[1] || "", etape: c[2] || "", dernier: c[3] || "", prochaine: c[4] || "" });
    }
    return rows;
  }
  function goChat(prefill, sendNow) { show("chat"); if (sendNow) return send(prefill); const t = $("input"); t.value = prefill; autosize(); t.focus(); }

  async function loadCrm() {
    const box = $("crm"); box.replaceChildren();
    if (!connected) return needConnector(box);
    try {
      const r = await call("memoire_lire", { chemin: "/crm/pipeline.md" });
      const rows = parsePipeline(r.contenu || "");
      const active = rows.filter((x) => !/gagn|perdu|ne plus/i.test(x.etape)).length;
      const meetings = rows.filter((x) => /rendez|proposition/i.test(x.etape)).length;
      const won = rows.filter((x) => /gagn/i.test(x.etape)).length;
      const stats = el("div", "stats");
      [[active, "en cours"], [meetings, "rendez-vous ou propositions"], [won, "gagnés"]].forEach(([n, l]) => { const s = el("div", "stat"); s.append(el("b", null, String(n)), el("span", null, l)); stats.append(s); });
      box.append(stats);
      box.append(el("div", "section-title", "Pipeline"));
      if (!rows.length) {
        const g = el("div", "group"); g.append(emptyState("target", "Aucun prospect pour l'instant. Demande-moi de t'en trouver.")); box.append(g);
      } else {
        const g = el("div", "group");
        rows.forEach((x) => {
          const st = x.etape.toLowerCase();
          const tag = el("span", "tag" + (st.includes("gagn") ? " won" : /perdu|ne plus/.test(st) ? " lost" : ""), x.etape || "—");
          g.append(cell({ title: x.entreprise, sub: [x.contact, x.prochaine].filter(Boolean).join(" · "), tag, onclick: () => goChat("Où en est-on avec " + x.entreprise + " ? Prépare la prochaine action.") }));
        });
        box.append(g);
      }
    } catch (e) { box.append(el("p", "err", explain(e) === "setup" ? "Connecteur non branché." : explain(e))); }
    box.append(el("div", "section-title", "Actions"));
    const g = el("div", "group with-icons");
    g.append(cell({ icon: "refresh", color: "blue", title: "Relances du jour", sub: "Vérifie les réponses et prépare les brouillons", onclick: () => goChat("Quelles relances de prospection dois-je faire aujourd'hui ? Prépare les brouillons.", true) }));
    g.append(cell({ icon: "target", color: "orange", title: "Trouver des prospects", sub: "Entreprises, décideurs, sources", onclick: () => goChat("Trouve-moi 10 entreprises à prospecter dans ") }));
    box.append(g);
  }

  async function loadMemory(path) {
    const box = $("mem"); box.replaceChildren();
    const back = $("memBack"); back.replaceChildren();
    $("memTitle").textContent = path ? path.split("/").pop().replace(/\.md$/, "") : "Mémoire";
    $("memSmall").textContent = $("memTitle").textContent;
    if (!connected) return needConnector(box);
    if (path) {
      const b = el("button", "navbtn glass"); b.type = "button"; b.setAttribute("aria-label", "Retour à la mémoire");
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.innerHTML = '<path d="M15 5l-7 7 7 7"/>';
      b.append(s, "Mémoire"); b.onclick = () => loadMemory(); back.append(b);
      box.append(el("div", "subtitle mono", path));
      try { const r = await call("memoire_lire", { chemin: path }); box.append(el("div", "doc", r.contenu || "(vide)")); }
      catch (e) { box.append(el("p", "err", explain(e))); }
      const g = el("div", "group"); g.style.marginTop = "12px";
      g.append(cell({ title: "Corriger avec l'agent", cls: "action", onclick: () => goChat("Dans ta mémoire (" + path + "), corrige : ") }));
      box.append(g);
      return;
    }
    box.append(el("p", "subtitle", "Ce que l'agent a retenu sur toi, tes contacts, tes projets et ton équipe."));
    try {
      const r = await call("memoire_liste", { prefixe: "/" });
      const files = r.fichiers || [];
      if (!files.length) { box.append(emptyState("doc", "La mémoire est vide pour l'instant.")); return; }
      const groups = {};
      files.forEach((f) => { const parts = f.chemin.split("/").filter(Boolean); const k = parts.length > 1 ? parts[0] : "général"; (groups[k] = groups[k] || []).push(f); });
      const color = { "général": "blue", crm: "orange", contacts: "green", projets: "indigo", equipe: "teal", journal: "gray" };
      Object.keys(groups).sort((a, b) => (a === "général" ? -1 : b === "général" ? 1 : a.localeCompare(b))).forEach((k) => {
        box.append(el("div", "section-title", k));
        const g = el("div", "group with-icons");
        groups[k].forEach((f) => g.append(cell({ icon: "doc", color: color[k] || "gray", title: f.chemin.split("/").pop().replace(/\.md$/, ""), value: Math.max(1, Math.round((f.taille || 0) / 1024)) + " Ko", onclick: () => { loadMemory(f.chemin); $("view-mem").scrollTop = 0; } })));
        box.append(g);
      });
    } catch (e) { box.append(el("p", "err", explain(e) === "setup" ? "Connecteur non branché." : explain(e))); }
  }

  async function loadSettings() {
    const box = $("set"); box.replaceChildren();
    if (connected) {
      box.append(el("div", "section-title", "Services"));
      const g = el("div", "group with-icons");
      try {
        const s = await call("statut", {});
        const row = (icon, color, title, ok) => g.append(cell({ icon, color, title, value: ok ? "Branché" : "Non branché", on: ok }));
        row("sparkle", "blue", "Agent", s.agent);
        row("mail", "red", "Gmail, agenda, contacts", s.google);
        row("bubble2", "teal", "Telegram", s.telegram);
        row("chat", "green", "WhatsApp", s.whatsapp);
        row("repo", "indigo", "Skills du dépôt", s.skills);
        g.append(cell({ icon: "hand", color: "orange", title: "Validations en attente", value: String(s.en_attente || 0) }));
      } catch (e) { g.append(el("p", "err", explain(e))); }
      box.append(g);
      box.append(el("div", "section-title", "Conversation"));
      const g2 = el("div", "group");
      const status = el("p", "section-note", "La mémoire est conservée quand tu démarres une nouvelle conversation.");
      g2.append(cell({ title: "Nouvelle conversation", cls: "action", onclick: async () => { try { await call("nouvelle_conversation", {}); rendered.clear(); lastId = 0; lastAt = 0; $("thread").replaceChildren(); show("chat"); fastPoll(); } catch (e) { status.textContent = explain(e); } } }));
      g2.append(cell({ title: "Arrêter l'agent", cls: "destructive", onclick: async () => { try { await call("arreter", {}); status.textContent = "L'agent s'est arrêté."; } catch (e) { status.textContent = explain(e); } } }));
      box.append(g2, status);
    } else {
      box.append(emptyState("sparkle", "Le connecteur n'est pas encore branché. Les étapes sont dans l'onglet Discussion."));
    }
    box.append(el("div", "section-title", "Apparence"));
    const ga = el("div", "group");
    const seg = el("div", "segmented"); seg.setAttribute("role", "radiogroup"); seg.setAttribute("aria-label", "Effet verre");
    seg.dataset.value = glassMode();
    seg.append(el("span", "thumb"));
    [["clear", "Transparent"], ["tinted", "Teinté"]].forEach(([v, label]) => {
      const b = el("button", null, label); b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(seg.dataset.value === v));
      b.onclick = () => { setGlass(v); seg.dataset.value = v; seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-checked", String(x === b))); };
      seg.append(b);
    });
    ga.append(el("div", "section-note", "Effet verre des barres et des boutons. « Teinté » est plus lisible sur les fonds chargés."), seg);
    box.append(ga);
    box.append(el("div", "section-title", "Dis Siri, Instinct"));
    const g3 = el("div", "group");
    [
      ["Nouveau raccourci", "App Raccourcis › + › nomme-le « Instinct »."],
      ["Dicter le texte", "Langue : français."],
      ["Obtenir le contenu de l'URL", "https://<ta-passerelle>/siri · POST · en-tête Authorization : Bearer <SIRI_TOKEN> · JSON : texte = Texte dicté."],
      ["Obtenir la valeur du dictionnaire", "Clé : reponse."],
      ["Énoncer le texte", "Siri lit la réponse ; les validations arrivent ici."],
    ].forEach(([t, s], i) => { const c = el("div", "cell"); const gr = el("div", "grow"); gr.append(el("div", "t", t), el("div", "s", s)); c.append(el("span", "num", String(i + 1)), gr); g3.append(c); });
    box.append(g3);
  }

  // ------------------------------------------------------------- verre et dock
  function glassMode() { try { return localStorage.getItem("instinct-glass") === "tinted" ? "tinted" : "clear"; } catch { return "clear"; } }
  function setGlass(v) { document.documentElement.dataset.glass = v; try { localStorage.setItem("instinct-glass", v); } catch {} }
  function toggleChips(open) {
    const chips = $("chips"); const plus = $("plus");
    const next = typeof open === "boolean" ? open : chips.hidden;
    chips.hidden = !next; plus.setAttribute("aria-expanded", String(next));
  }
  $("plus").onclick = () => toggleChips();
  setGlass(glassMode());
  const dock = $("dock");
  const syncDock = () => document.documentElement.style.setProperty("--dock-h", dock.offsetHeight + "px");
  if (window.ResizeObserver) new ResizeObserver(syncDock).observe(dock);
  syncDock();

  // ------------------------------------------------------------- démarrage
  async function boot() {
    $("setup").hidden = true;
    setState("", "Connexion…");
    const use = window.claude && typeof window.claude.use === "function" ? (n) => window.claude.use(n) : async () => null;
    mcp = await use("mcp");
    if (!downloads) downloads = await use("downloads");
    if (!mcp) { showSetup("Ouvre cette app dans claude.ai ou dans l'app Claude pour utiliser le connecteur."); return; }
    try {
      const list = await mcp.listTools(SERVER);
      const info = (list.servers || []).find((x) => x.server === SERVER);
      if (!info) return showSetup();
      if (info.authStatus === "needs_reauth") return showSetup(explain({ code: "needs_reauth" }));
    } catch (e) { return showSetup(explain(e)); }
    connected = true;
    await refresh();
    schedule();
  }

  CHIPS.forEach(([icon, label, text]) => {
    const c = el("button", "chip glass"); c.type = "button"; c.append(svg(icon), label);
    c.onclick = () => { toggleChips(false); if (text.endsWith(" ")) goChat(text); else send(text); };
    $("chips").append(c);
  });
  $("composer").addEventListener("submit", (e) => { e.preventDefault(); send($("input").value); });
  $("input").addEventListener("input", autosize);
  $("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer: fine)").matches) { e.preventDefault(); send($("input").value); } });
  document.querySelectorAll("nav.tabs button").forEach((b) => (b.onclick = () => show(b.dataset.view)));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && connected) { refresh(); schedule(); } });

  boot();
})();
</script>
